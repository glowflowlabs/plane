networks:
  default:
    name: plane-network
    driver: bridge

services:
  web:
    container_name: web
    ports:
    - "9000:3000"
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9002}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-http://localhost:9000}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-http://localhost:9001}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/god-mode}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL:-}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH:-/spaces}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL:-}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
    restart: always
    networks:
      - default
    depends_on:
      - api

  admin:
    container_name: admin
    ports:
    - "9001:3000"
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - default
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - default
    depends_on:
      - api
      - web

  api:
    container_name: api
    ports:
    - "9002:8000"
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    networks:
      - default
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9000,http://localhost:9001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}}
      - REDIS_URL=${REDIS_URL:-redis://plane-redis:6379}
      - AMQP_URL=${AMQP_URL:-amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/${RABBITMQ_VHOST:-plane}}
      - SECRET_KEY=${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
      - USE_MINIO=${USE_MINIO:-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-access-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-secret-key}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - API_KEY_RATE_LIMIT=${API_KEY_RATE_LIMIT:-60/minute}
      - LIVE_SERVER_SECRET_KEY=${LIVE_SERVER_SECRET_KEY:-}
    depends_on:
      - plane-db
      - plane-redis

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    networks:
      - default

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    networks:
      - default
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    networks:
      - default
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    networks:
      - default
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    networks:
      - default
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  # Disabled for Dokploy - Dokploy manages reverse proxy
  # proxy:
  #   container_name: proxy
  #   build:
  #     context: ./apps/proxy
  #     dockerfile: Dockerfile.ce
  #   restart: always
  #   ports:
  #     - ${LISTEN_HTTP_PORT:-8080}:80
  #     - ${LISTEN_HTTPS_PORT:-8443}:443
  #   environment:
  #     FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  #     BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  #   depends_on:
  #     - web
  #     - api
  #     - space
  #     - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
